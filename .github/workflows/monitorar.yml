name: Executar alertas
on:
  schedule:
    - cron: '7 * * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: Modo de execução
        type: choice
        options: [dry-run, live, test, probe, replay, recover]
        default: dry-run
      alert:
        description: ID do alerta (consulte alertas.json); all executa todos os ativos
        type: string
        default: all
permissions:
  contents: write
concurrency:
  group: alertas
  cancel-in-progress: false
jobs:
  monitorar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Testes
        run: python -m unittest discover -s tests -v
      - name: Restaurar estado
        id: state
        run: |
          state_ref=$(git ls-remote --heads origin alert-state)
          if [ -n "$state_ref" ]; then
            git fetch origin alert-state
            git show FETCH_HEAD:state.json > state.json
          else
            echo '{"sent": []}' > state.json
          fi
      - name: Executar catálogo de alertas
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          MODE: ${{ inputs.mode || 'live' }}
          ALERT: ${{ inputs.alert || 'all' }}
          ESCUTA_SOCIAL_TERMS_JSON: ${{ secrets.ESCUTA_SOCIAL_TERMS_JSON }}
          SERPAPI_API_KEY: ${{ secrets.SERPAPI_API_KEY }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [ "$MODE" = live ] && [ -z "$DISCORD_WEBHOOK_URL" ]; then
            echo '::warning::Configure DISCORD_WEBHOOK_URL; executando dry-run.'
            MODE=dry-run
          fi
          if [ "$MODE" = replay ] || [ "$MODE" = recover ]; then
            if [ "$ALERT" != tendencias_por_estado ]; then
              echo '::error::replay/recover exigem tendencias_por_estado.'
              exit 1
            fi
            if [ "$MODE" = recover ]; then
              python -m tendencias_busca.recuperar
            else
              python -m tendencias_busca.run --cached --dry-run
            fi
          elif [ "$MODE" = probe ]; then
            if [ "$ALERT" != tendencias_por_estado ]; then
              echo '::error::probe está disponível somente para tendencias_por_estado.'
              exit 1
            fi
            python -m tendencias_busca.diagnostico
          else
            args=(--alert "$ALERT" --mode "$MODE")
            if [ "$EVENT_NAME" = schedule ]; then
              args+=(--scheduled)
            fi
            python main.py "${args[@]}"
          fi
      - name: Salvar entregas confirmadas
        if: always() && steps.state.outcome == 'success' && (inputs.mode == 'live' || inputs.mode == 'test' || inputs.mode == 'recover' || github.event_name == 'schedule')
        run: |
          test -f state.json || exit 0
          origin_url=$(git remote get-url origin)
          auth_header=$(git config --get http.https://github.com/.extraheader)
          state_dir=$(mktemp -d)
          cp state.json "$state_dir/state.pending"
          git -C "$state_dir" init
          git -C "$state_dir" remote add origin "$origin_url"
          git -C "$state_dir" config http.https://github.com/.extraheader "$auth_header"
          git -C "$state_dir" config user.name github-actions[bot]
          git -C "$state_dir" config user.email 41898282+github-actions[bot]@users.noreply.github.com
          state_ref=$(git -C "$state_dir" ls-remote --heads origin alert-state)
          if [ -n "$state_ref" ]; then
            git -C "$state_dir" fetch origin alert-state
            git -C "$state_dir" checkout -b alert-state FETCH_HEAD
          else
            git -C "$state_dir" checkout --orphan alert-state
          fi
          mv "$state_dir/state.pending" "$state_dir/state.json"
          python -m tendencias_busca.cache --state "$state_dir/state.json" --output-dir "$state_dir/dados/tendencias"
          git -C "$state_dir" add state.json
          if [ -d "$state_dir/dados/tendencias" ]; then
            git -C "$state_dir" add dados/tendencias
          fi
          if ! git -C "$state_dir" diff --cached --quiet; then
            git -C "$state_dir" commit -m 'Atualizar identificadores de alertas enviados'
            git -C "$state_dir" push origin alert-state
          fi
