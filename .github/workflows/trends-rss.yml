name: Assuntos recentes Google Trends RSS
on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: Modo de execução
        type: choice
        options: [dry-run, live]
        default: dry-run
permissions:
  id-token: write
  contents: write
concurrency:
  group: alertas
  queue: max
  cancel-in-progress: false
jobs:
  monitorar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      WHATSAPP_TOPIC: ${{ vars.WHATSAPP_TOPIC }}
      WHATSAPP_GOOGLE_APPLICATION_CREDENTIALS: ${{ github.workspace }}/whatsapp-credentials.json
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Instalar dependências
        run: pip install -r requirements.txt
      - name: Authenticate WhatsApp publisher (separate from BigQuery)
        if: vars.WHATSAPP_TOPIC != ''
        id: whatsapp_auth
        continue-on-error: true
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.WHATSAPP_WIF_PROVIDER }}
          service_account: ${{ vars.WHATSAPP_PUBLISHER_SA }}
          export_environment_variables: false
      - name: Prepare WhatsApp credentials and dependencies
        continue-on-error: true
        if: vars.WHATSAPP_TOPIC != '' && steps.whatsapp_auth.outcome == 'success'
        env:
          CREDENTIALS_PATH: ${{ steps.whatsapp_auth.outputs.credentials_file_path }}
        run: |
          cp "$CREDENTIALS_PATH" "$WHATSAPP_GOOGLE_APPLICATION_CREDENTIALS"
          chmod 600 "$WHATSAPP_GOOGLE_APPLICATION_CREDENTIALS"
          pip install 'google-auth==2.40.3' 'requests==2.32.5'
      - name: Testes
        env:
          WHATSAPP_TOPIC: ''
        run: python -m unittest discover -s tests -v
      - name: Restaurar estado
        id: state
        run: |
          state_ref=$(git ls-remote --heads origin alert-state)
          if [ -n "$state_ref" ]; then
            git fetch origin alert-state
            git show FETCH_HEAD:state.json > state.json
          else
            echo '{"sent": []}' > state.json
          fi
      - name: Consultar RSS e publicar novidades
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          MODE: ${{ inputs.mode || 'live' }}
        run: |
          if [ "$MODE" = live ]; then
            python -m tendencias_rss.run
          else
            python -m tendencias_rss.run --dry-run
          fi
      - name: Salvar entregas confirmadas
        if: always() && steps.state.outcome == 'success' && (inputs.mode == 'live' || github.event_name == 'schedule')
        run: |
          test -f state.json || exit 0
          origin_url=$(git remote get-url origin)
          auth_header=$(git config --get http.https://github.com/.extraheader)
          state_dir=$(mktemp -d)
          cp state.json "$state_dir/state.pending"
          git -C "$state_dir" init
          git -C "$state_dir" remote add origin "$origin_url"
          git -C "$state_dir" config http.https://github.com/.extraheader "$auth_header"
          git -C "$state_dir" config user.name github-actions[bot]
          git -C "$state_dir" config user.email 41898282+github-actions[bot]@users.noreply.github.com
          state_ref=$(git -C "$state_dir" ls-remote --heads origin alert-state)
          if [ -n "$state_ref" ]; then
            git -C "$state_dir" fetch origin alert-state
            git -C "$state_dir" checkout -b alert-state FETCH_HEAD
          else
            git -C "$state_dir" checkout --orphan alert-state
          fi
          mv "$state_dir/state.pending" "$state_dir/state.json"
          python -m tendencias_busca.cache --state "$state_dir/state.json" --output-dir "$state_dir/dados/tendencias"
          git -C "$state_dir" add state.json
          if [ -d "$state_dir/dados/tendencias" ]; then
            git -C "$state_dir" add dados/tendencias
          fi
          if ! git -C "$state_dir" diff --cached --quiet; then
            git -C "$state_dir" commit -m 'Atualizar identificadores de alertas enviados'
            git -C "$state_dir" push origin alert-state
          fi
      - name: Retry pending WhatsApp publications
        if: always() && vars.WHATSAPP_TOPIC != ''
        run: python whatsapp_bridge.py --flush
      - name: Preserve pending WhatsApp messages
        if: always() && vars.WHATSAPP_TOPIC != ''
        uses: actions/upload-artifact@v4
        with:
          name: whatsapp-pending-${{ github.run_id }}-${{ github.run_attempt }}
          path: .whatsapp-outbox/
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 7
      - name: Remove temporary WhatsApp credentials
        if: always()
        run: rm -f "$WHATSAPP_GOOGLE_APPLICATION_CREDENTIALS"
